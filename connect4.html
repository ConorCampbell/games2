<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect 4 Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg1: #081b33;
      --bg2: #133f72;
      --board: #0e4eb7;
      --board-shadow: #0a3580;
      --panel: rgba(255, 255, 255, 0.12);
      --text: #f7fbff;
      --red: #f95c53;
      --yellow: #ffd24f;
      --ok: #77f2a8;
      --warn: #ffb86b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 255, 255, 0.2) 0, rgba(255, 255, 255, 0) 36%),
        radial-gradient(circle at 90% 85%, rgba(255, 220, 120, 0.24) 0, rgba(255, 220, 120, 0) 42%),
        linear-gradient(155deg, var(--bg1), var(--bg2));
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: min(980px, 100%);
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }

    .top-bar {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 12px;
      display: grid;
      gap: 10px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
    }

    .title {
      font-family: "Bungee", sans-serif;
      font-size: clamp(1.3rem, 4vw, 2rem);
      letter-spacing: 0.06em;
      margin: 0;
      color: #fff4bd;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .score-card {
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      font-weight: 900;
      background: rgba(0, 0, 0, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.25);
      min-height: 66px;
    }

    .score-card .name {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .score-card .value {
      font-size: 1.7rem;
      line-height: 1;
    }

    .score-card.red {
      outline: 3px solid rgba(249, 92, 83, 0.3);
    }

    .score-card.yellow {
      outline: 3px solid rgba(255, 210, 79, 0.35);
    }

    .control-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .control {
      display: grid;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    select,
    button {
      font-family: "Nunito", sans-serif;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-weight: 800;
    }

    select {
      background: rgba(255, 255, 255, 0.95);
      color: #17385d;
    }

    .sound-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 8px 10px;
    }

    .sound-label {
      font-size: 0.92rem;
      font-weight: 800;
      opacity: 0.9;
    }

    .sound-icon {
      font-size: 1rem;
      line-height: 1;
      opacity: 0.55;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .sound-row.is-on .sound-icon.on {
      opacity: 1;
      transform: scale(1.08);
    }

    .sound-row:not(.is-on) .sound-icon.off {
      opacity: 1;
      transform: scale(1.08);
    }

    .sound-switch {
      position: relative;
      width: 64px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    .sound-switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .sound-slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #5a6e90, #364c6f);
      border: 1px solid rgba(255, 255, 255, 0.35);
      transition: background 0.25s ease;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.35);
    }

    .sound-slider::before {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      top: 3px;
      left: 3px;
      border-radius: 50%;
      background: #f7fbff;
      transition: transform 0.25s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .sound-switch input:checked + .sound-slider {
      background: linear-gradient(135deg, #87f6bc, #3ed38f);
    }

    .sound-switch input:checked + .sound-slider::before {
      transform: translateX(30px);
    }

    .sound-switch input:focus-visible + .sound-slider {
      outline: 3px solid rgba(255, 255, 255, 0.55);
      outline-offset: 2px;
    }

    button {
      background: #f4f8ff;
      color: #143763;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }

    button.primary {
      background: linear-gradient(135deg, #7cffb4, #42d99c);
    }

    button.warn {
      background: linear-gradient(135deg, #ffd07f, #ffac56);
    }

    .status {
      background: rgba(0, 0, 0, 0.22);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 10px;
      text-align: center;
      font-weight: 800;
      min-height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .board-wrap {
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 14px 45px rgba(0, 0, 0, 0.35);
    }

    .board-overlay {
      position: absolute;
      inset: 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 10, 26, 0.35);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 3;
    }

    .board-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-card {
      width: min(340px, 90%);
      background: rgba(14, 33, 70, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      gap: 10px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    }

    .overlay-title {
      margin: 0;
      text-align: center;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: #fff4bd;
      font-size: 1.02rem;
    }

    .overlay-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    #connect4Canvas {
      width: 100%;
      aspect-ratio: 7 / 6;
      display: block;
      border-radius: 12px;
      background: linear-gradient(180deg, #1d6be1, #0d429d);
      touch-action: manipulation;
    }

    .hint {
      text-align: center;
      opacity: 0.9;
      font-size: 0.92rem;
      font-weight: 700;
      margin-top: 8px;
    }

    @media (min-width: 900px) {
      .app {
        grid-template-columns: 320px 1fr;
        align-items: start;
      }

      .top-bar {
        position: sticky;
        top: 12px;
      }

    }

    @media (max-width: 520px) {
      .overlay-buttons {
        grid-template-columns: 1fr;
      }

      .overlay-card {
        width: min(300px, 92%);
      }

      .sound-row {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top-bar">
      <h1 class="title">Connect 4 Arena</h1>

      <div class="scoreboard">
        <div class="score-card red" id="scoreCard1">
          <div class="name" id="player1Name">Red</div>
          <div class="value" id="score1">0</div>
        </div>
        <div class="score-card yellow" id="scoreCard2">
          <div class="name" id="player2Name">Yellow</div>
          <div class="value" id="score2">0</div>
        </div>
      </div>

      <div class="control-row">
        <label class="control" for="gameMode">
          Mode
          <select id="gameMode" aria-label="Game mode">
            <option value="pvp">2 Players</option>
            <option value="cpu">Vs Computer</option>
          </select>
        </label>

        <label class="control" for="difficulty">
          Computer
          <select id="difficulty" aria-label="CPU difficulty">
            <option value="1">Coin Flip</option>
            <option value="2">Lucky Bounce</option>
            <option value="3" selected>Street Player</option>
            <option value="4">Trap Setter</option>
            <option value="5">Master Planner</option>
            <option value="6">Board Oracle</option>
          </select>
        </label>
      </div>

      <div class="sound-row" id="soundRow">
        <span class="sound-label">Sound</span>
        <span class="sound-icon off" aria-hidden="true">🔇</span>
        <label class="sound-switch" for="audioToggle" aria-label="Toggle sound">
          <input type="checkbox" id="audioToggle" />
          <span class="sound-slider"></span>
        </label>
        <span class="sound-icon on" aria-hidden="true">🔊</span>
      </div>

      <div class="status" id="statusText">Red to move</div>
    </section>

    <section class="board-wrap">
      <canvas id="connect4Canvas" width="840" height="720" aria-label="Connect 4 board"></canvas>
      <div class="board-overlay" id="boardOverlay" aria-live="polite">
        <div class="overlay-card">
          <p class="overlay-title">Round Controls</p>
          <div class="overlay-buttons">
            <button class="primary" id="newRoundBtn">Play</button>
            <button class="warn" id="resetScoreBtn">Restart</button>
          </div>
        </div>
      </div>
      <div class="hint">Click or tap a column to drop a disc</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tone@15.0.4/build/Tone.js"></script>
  <script src="static/js/connect4.js"></script>
</body>
</html>
